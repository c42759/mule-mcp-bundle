services:
    fetch:
        container_name: walpaca_mcp_fetch
        build: ./fetch
        ports:
            - "8081:8080"
        restart: always

    web-search:
        container_name: walpaca_mcp_web_search
        build: ./web-search
        ports:
            - "8082:8080"
        restart: always

    youtube:
        container_name: walpaca_mcp_youtube
        build: ./youtube
        ports:
            - "8083:8080"
        restart: always

    website:
        container_name: walpaca_mcp_website
        build: ./website
        ports:
            - "8084:8080"
        restart: always

    memory:
        container_name: walpaca_mcp_memory
        build: ./memory
        ports:
            - "8085:8080"
        volumes:
            - ./memory/data:/app/data
        restart: always

    weather:
        container_name: walpaca_mcp_weather
        build: ./weather
        ports:
            - "8086:8080"
        restart: always

    location:
        container_name: walpaca_mcp_location
        build: ./location
        ports:
            - "8087:8080"
        restart: always

    linux-utils:
        container_name: walpaca_mcp_linux_utils
        build: ./linux-utils
        ports:
            - "8088:8080"
        environment:
            SEARCH_ROOTS: "/host/home"
            SYSTEMD_IGNORE_CHROOT: "1"
        volumes:
            # search_files root (read-only)
            - "${LINUX_UTILS_SEARCH_DIR:-${HOME}}:/host/home:ro"
            # systemctl status / list-units via host systemd D-Bus
            - /run/systemd:/run/systemd:ro
            - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
            # journalctl host logs
            - /var/log/journal:/var/log/journal:ro
            - /etc/machine-id:/etc/machine-id:ro
            # lsblk filesystem labels/UUIDs
            - /run/udev:/run/udev:ro
            # fastfetch reports host OS instead of container Debian
            - /etc/os-release:/etc/os-release:ro
        restart: always

    vector-memory:
        container_name: walpaca_mcp_vector_memory
        build: ./vector-memory
        ports:
            - "8089:8080"
        environment:
            VECTOR_MEMORY_DATA_DIR: "/app/data"
            API_KEYS_FILE: "/app/api_keys.json"
            EMBEDDING_BACKEND: "${EMBEDDING_BACKEND:-local}"
            EMBEDDING_MODEL: "${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}"
            EMBEDDING_DIM: "${EMBEDDING_DIM:-384}"
            FASTEMBED_CACHE_DIR: "/app/data/models"
            EMBEDDING_API_URL: "${EMBEDDING_API_URL:-http://host.docker.internal:11434/v1/embeddings}"
            EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./vector-memory/data:/app/data
            - ./vector-memory/api_keys.json:/app/api_keys.json:ro
        restart: always

